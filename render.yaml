services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: lokiresume-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: ADMIN_EMAIL
        value: "admin@lokiresume.com"
      - key: ADMIN_PASSWORD
        value: "AdminLoku@2026!#Secret"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: lokiresume-frontend
          property: host

  # 2. React + Vite Frontend Static Site
  - type: web
    name: lokiresume-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lokiresume-backend
          property: host
